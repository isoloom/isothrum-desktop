[package]
name = "isothrum-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Its own workspace: GTK/WebKit are needed here only.
[workspace]

# Release profile pinned to Cargo's fast defaults, kept EXPLICIT on purpose. The app drives
# VMs/containers and is I/O-bound, so link-time optimization buys it nothing — and a max-LTO release
# of this ~500-crate graph is exactly the kind of thing that blew the CI budget as the old universal
# macOS build. Locking `lto = false` here stops a future tauri/template or dependency bump from
# silently switching LTO back on. `codegen-units = 16` is the default; it is written out so that
# value is pinned too (raising it was measured to NOT speed the compile up — the build is bound by
# the dependency graph's critical path and, on CI's few-core runners, by core count, not by
# intra-crate codegen parallelism). `strip` trims the shipped binary (~24 MB stripped). `incremental`
# stays off: each CI leg starts from the restored dependency cache, so incremental state would only
# bloat that cache without ever being reused across runs.
[profile.release]
lto = false
codegen-units = 16
incremental = false
strip = true

[lib]
name = "isothrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Isoloom's published crates (crates.io, 1.0.x): the spec the editor's compiler writes, the lab it
# lowers to and the files each target generates — the same libraries as the runner this app embeds.
isoloom-spec = "1.0.1"
isoloom-targets = "1.0.1"
tauri-plugin-updater = "2"

[dev-dependencies]
# The tests run what the editor's compiler writes (published on crates.io, 1.0.x).
isothrum-compiler = "1.0.1"
