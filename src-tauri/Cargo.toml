[package]
name = "isothrum-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Its own workspace: GTK/WebKit are needed here only.
[workspace]

[lib]
name = "isothrum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Isoloom's published crates (crates.io, 1.0.x): the spec the editor's compiler writes, the lab it
# lowers to and the files each target generates — the same libraries as the runner this app embeds.
isoloom-spec = "1.0.1"
isoloom-targets = "1.0.1"
tauri-plugin-updater = "2"

[dev-dependencies]
# The tests run what the editor's compiler writes (published on crates.io, 1.0.x).
isothrum-compiler = "1.0.1"
